name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icon and splash (Material 3)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0F172A' --iconBackgroundColorDark '#0F172A' --splashBackgroundColor '#0F172A' --splashBackgroundColorDark '#0F172A'

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ELOCHILL.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELOCHILL-APK
          path: ELOCHILL.apk
          if-no-files-found: error

      - name: Attach to Release (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ELOCHILL.apk
          generate_release_notes: true
